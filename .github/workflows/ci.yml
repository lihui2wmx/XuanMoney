name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Project policy: GitHub-hosted official runner only; never self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
